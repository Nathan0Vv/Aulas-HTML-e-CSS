<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style-ola.css">
    <title>Olá Mundo!!</title>
</head>

<body>

    <header id= "header">
        <a id= "logo" href="olaMundo.html"><img src="./img/terra.jpg" alt="Logo da empresa"></a>

        <button arial-label=" abrir menu" id="btn-mobile" arial-haspopup="true" arial-controls= "menu" arial-expanded="false">
            <span id="hamburger"></span>
        </button>

        <ul id="menu" role="menu">
            <li role="none"><a class="menu-link" role="menuitem" href="./html/olaMundo.html" arial-current="page">Home</a></li>
            <li role="none"><a class="menu-link" href="./quem-somos.html">Quem Somos</a></li>
            <li role="none"><a class="menu-link" href="./produtos.html">Produtos</a></li>
            <li role="none"><a class="menu-link" href="./contato.html">Contato</a></li>
            <li role="none"><a class="menu-link" href="./videos.html">Vídeos</a></li>
        </ul>
    </header>

        <main id="conteudo">
            <section aria-label="Texto Alternativo" id="hieroglyphs"></section>

            <section aria-label="Destaque em Banner">

                <div id="carouselExampleInterval" class="carousel slide" data-bs-rise="carousel" data-bs-pause="none">
                <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="800">
                <img src="./img/banner1.jpg" class="d-block w-100" alt="Imagem do banner 1">
            </div>

                <div class="carousel-item"
                data-bs-interval="600">
                <img src="./img/banner2.jfif" class="d-block w-100" alt="Imagem do banner 2">
            </div>

                <div class="carousel-item"
                data-bs-interval="600">    
                <img src="./img/banner3.jpg" class="d-block w-100" alt="Imagem do banner 3">
            </div>

                <div class="carousel-item"
                data-bs-interval="600">
                <img src="./img/banner4.jpg" class="d-block w-100" alt="Imagem do banner 4">
            </div>            

                <div class="carousel-item"
                data-bs-interval="600">
                <img src="./img/banner5.jpg" class="d-block w-100" alt="Imagem do banner 5">
            </div>

            <button 
            class="carousel-control-prev" 
            type="button" 
            data-bs-target="#carouselExampleInterval" 
            data-bs-slide="prev"
            arial-label="Anterior">

            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
            
            </button>
            <button 
            class="carousel-control-next" 
            type="button" 
            data-bs-target="#carouselExampleInterval" 
            data-bs-slide="next"
            arial-label="Próximo">

            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>

            </button>
            </div>
            </div>
            </section>

        </main>
</body>

    <script src="./bootstrap/js/bootstrap.min.js"></script>

</html>
